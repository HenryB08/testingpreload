<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Syntrex Preloader — widget demo</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800;900&display=swap"
      rel="stylesheet"
    />
    <style>
      body {
        margin: 0;
        background: #00020d;
        color: #fff;
        font-family: 'Outfit', system-ui, sans-serif;
        min-height: 200vh;
      }
      .demo-hero {
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        padding: 2rem;
      }
      .demo-hero h1 {
        font-size: clamp(2.5rem, 8vw, 6rem);
        font-weight: 800;
        letter-spacing: -0.02em;
        margin: 0;
      }
      .demo-hero p {
        color: #9bb4ff;
        max-width: 40ch;
        font-weight: 300;
      }
    </style>
    <!-- Demo only: clear the once-per-session flag so it replays every refresh -->
    <script>
      try { sessionStorage.removeItem('sxpShown') } catch (e) {}
    </script>
    <script src="./syntrex-preloader.js" defer></script>
  </head>
  <body>
    <section class="demo-hero">
      <h1>This is your site.</h1>
      <p>The preloader played first, then faded away to reveal this page. On your real site this is your existing index.html.</p>
    </section>
  </body>
</html>
